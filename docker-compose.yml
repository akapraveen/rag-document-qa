services:
  api:
    build: .
    env_file: .env
    environment:
      RAG_DATA_DIR: /data
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - rag-data:/data
    ports:
      - "8000:8000"
  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  rag-data:
